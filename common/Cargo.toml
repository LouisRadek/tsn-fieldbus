[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
# Serialization and Error handling (Keep these from before)
serde = { version = "1.0", features = ["derive"] }
byteorder = "1.5"
thiserror = "1.0"

# gRPC Runtime Dependencies
tonic = "0.12"           # The gRPC implementation
prost = "0.13"           # Protocol Buffers implementation

[build-dependencies]
tonic-build = "0.12"     # Compiles .proto files into Rust during build time
protobuf-src = "1.1"     # Protocol Buffer Compiler
