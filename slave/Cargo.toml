[package]
name = "slave"
version = "0.1.0"
edition = "2024"

[features]
default = []
test-utils = ["common/test-utils"]

[dependencies]
# Internal workspace dependency
common = { path = "../common" }

# Async Runtime (Required for gRPC)
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
hex = "0.4"
base64 = "0.21"
rand = "0.8"
sha2 = "0.10"

# gRPC Dependencies
tonic = "0.12"
prost = "0.13"

# Raw Socket Access
pnet = "0.35"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
common = { path = "../common", features = ["test-utils"] }
