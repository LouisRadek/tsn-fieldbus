[package]
name = "master"
version = "0.1.0"
edition = "2024"

[features]
default = []
test-utils = ["common/test-utils"]

[dependencies]
# Internal workspace dependency
common = { path = "../common" }

# Async Runtime (Required for gRPC)
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }

# gRPC Dependencies
tonic = "0.12"
prost = "0.13"

# Raw Socket Access (Keep from before)
pnet = "0.35"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
common = { path = "../common", features = ["test-utils"] }
